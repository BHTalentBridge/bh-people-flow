# Serves the built SPA and fronts the API on the same origin.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Uploaded avatars and Excel exports pass through here.
    client_max_body_size 25m;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS, re-resolved as it expires. Without it nginx
    # resolves `api` once at startup: it then refuses to boot whenever the API
    # container isn't up yet, and keeps a stale address after the API is
    # recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API, so the API's CORS configuration never comes into play.
    location /api/ {
        set $api_upstream http://api:4000;
        proxy_pass         $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Excel exports are assembled in one pass and can outlast the default.
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    # Hashed filenames — safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a redeploy leaves browsers pinned to
    # the previous bundle and its now-missing asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # BrowserRouter: a refresh on /my-projects has to serve index.html, or the
    # server 404s on a path only the client knows how to route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
